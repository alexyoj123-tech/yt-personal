name: project-g · LibreTube (daily auto-update)
# Descarga LibreTube oficial, re-firma con el keystore del repo y publica
# release ytp-g-libretube-X.X si la version cambio desde ayer.
# APK universal → sirve para arm64, armeabi-v7a y x86.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC diario (despues de project-a y project-e)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-g-libretube
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Fetch + sign + publish LibreTube
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar build-tools 34
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Fetch, firmar y publicar LibreTube
        env:
          ANDROID_KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN:                  ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:         ${{ github.repository }}
        run: |
          set -o pipefail
          bash project-g/scripts/fetch-sign-libretube.sh 2>&1 | tee /tmp/libretube.log

      - name: Guardar log si falla
        if: failure()
        run: |
          mkdir -p debug
          tail -150 /tmp/libretube.log > debug/last-error-libretube.log 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug/last-error-libretube.log
          git commit -m "debug: log LibreTube fallido (run ${{ github.run_id }})" || exit 0
          git pull --rebase --autostash || true
          git push || echo "push fallo (no bloqueante)"

      - name: Subir meta como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-g-meta-${{ github.run_id }}
          path: project-g/build/meta/
          retention-days: 14
          if-no-files-found: ignore
