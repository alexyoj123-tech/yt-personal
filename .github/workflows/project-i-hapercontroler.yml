name: project-i · HAPER CONTROLER (control remoto universal)
# Compila la app de control remoto desde el codigo fuente propio de
# project-i/, la firma con el keystore del repo y publica un release.
# Aditivo: no toca nada de project-a/d/e/f/g/h.

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar release (false = solo compilar y verificar)'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - 'project-i/**'
      - '.github/workflows/project-i-hapercontroler.yml'
  # Sin cron a proposito: esta app no depende de ningun upstream que se
  # mueva solo, asi que un build diario solo quemaria minutos.

permissions:
  contents: write

concurrency:
  group: project-i-hapercontroler
  cancel-in-progress: false

env:
  # La deprecacion de Node 20 en las actions de JavaScript rompe los runs
  # viejos; esto los fuerza a Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compilar, firmar y publicar HAPER CONTROLER
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # OJO: `cache: gradle` busca archivos Gradle en la RAIZ del repo y
          # falla porque aca viven dentro de project-i/. Se apunta el cache
          # explicitamente en vez de omitirlo.
          cache: gradle
          cache-dependency-path: |
            project-i/**/*.gradle*
            project-i/gradle/libs.versions.toml
            project-i/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar platform 37 + build-tools
        run: |
          # compileSdk 37: lo exige todo el AndroidX de 2026 (ver el comentario
          # en project-i/app/build.gradle.kts).
          # OJO con el id del paquete: es "platforms;android-37.0", CON el .0.
          # "platforms;android-37" a secas no existe y sdkmanager solo avisa
          # con un Warning antes de salir con codigo 1.
          sdkmanager "build-tools;37.0.0"
          sdkmanager "platforms;android-37.0" || \
            echo "aviso: no se pudo preinstalar la platform; AGP la descarga sola"
          echo "$ANDROID_SDK_ROOT/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Compilar, firmar, verificar y publicar
        env:
          ANDROID_KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN:                  ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:         ${{ github.repository }}
          PUBLICAR:                  ${{ inputs.publicar || 'true' }}
          GRADLE_OPTS:               '-Dorg.gradle.jvmargs=-Xmx4g'
        run: |
          set -o pipefail
          bash project-i/scripts/build-hapercontroler.sh 2>&1 | tee /tmp/hapercontroler.log

      - name: Guardar log si falla
        if: failure()
        run: |
          mkdir -p debug
          tail -300 /tmp/hapercontroler.log > debug/last-error-hapercontroler.log 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug/last-error-hapercontroler.log
          git commit -m "debug: log HAPER CONTROLER fallido (run ${{ github.run_id }})" || exit 0
          git pull --rebase --autostash || true
          git push || echo "push fallo (no bloqueante)"

      - name: Subir el APK como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-i-hapercontroler-${{ github.run_id }}
          path: project-i/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
