name: Run ReVanced pipeline
description: >
  Composite action que ejecuta fetch → patch → sign → release del Proyecto A
  en un runner Ubuntu. Usado por project-a-build.yml (diario) y
  project-a-manual.yml (dispatch con inputs).

inputs:
  youtube_version:
    description: 'Versión de YouTube a parchear (vacío = la más alta compatible)'
    required: false
    default: ''
  ytmusic_version:
    description: 'Versión de YT Music a parchear (vacío = la más alta compatible)'
    required: false
    default: ''
  publish_release:
    description: '¿Publicar Release con los APKs firmados?'
    required: false
    default: 'true'
  force_release:
    description: '¿Publicar aunque no haya cambios vs el release anterior?'
    required: false
    default: 'false'
  apkeep_source:
    description: 'Fuente de apkeep (valores válidos: apk-pure, google-play, f-droid, huawei-app-gallery). Para YT/YTM solo apk-pure es práctico sin credenciales.'
    required: false
    default: 'apk-pure'
  revanced_cli_repo:
    description: 'Owner/repo del CLI. Default Morphe (drop-in syntax compat v5). ReVanced/revanced-cli sigue funcional pero no mantiene los patches.'
    required: false
    default: 'MorpheApp/morphe-cli'
  revanced_cli_tag:
    description: 'Tag del CLI a usar. Vacío (default) = última release estable, igual que los patches, para que CLI y patches siempre coincidan. Fijar un tag solo para depurar. OJO: el asset del release se llama morphe-desktop-<ver>-all.jar desde v1.11.'
    required: false
    # Antes estaba fijo en v1.18.0 mientras los patches iban siempre a "latest".
    # Cuando salieron patches v1.48.0 (y luego v2.0.0, morphe-patcher 2.x) el CLI
    # viejo reventaba con NoSuchMethodError al cargar los patches.
    default: ''
  revanced_patches_repo:
    description: 'Owner/repo de los patches. Default MorpheApp/morphe-patches (formato .mpp, sucesor oficial tras archivado de inotia00 en marzo 2026).'
    required: false
    default: 'MorpheApp/morphe-patches'
  revanced_gmscore_repo:
    description: 'Owner/repo de GmsCore/MicroG. Default MorpheApp/MicroG-RE (12.8 MB, fork microG mantenido por Morphe, vendor app.revanced).'
    required: false
    default: 'MorpheApp/MicroG-RE'
  revanced_gmscore_regex:
    description: 'Regex del asset GmsCore. Default matchea naming MicroG-RE (microg-<ver>.apk). Override si upstream cambia el naming.'
    required: false
    default: 'microg-[0-9.]+\.apk$'
  release_note_prefix:
    description: 'Texto opcional prefixado como nota al body del Release (ej. "Release corregida. La anterior tenía APKs sin parchear...").'
    required: false
    default: ''
  android_keystore_base64:
    description: 'Base64 del keystore release'
    required: true
  android_keystore_password:
    description: 'Password del keystore'
    required: true
  android_key_alias:
    description: 'Alias de la key (yt-personal)'
    required: true
  android_key_password:
    description: 'Password de la key'
    required: true
  gh_token:
    description: 'Token de GitHub para crear el Release'
    required: true

runs:
  using: composite
  steps:
    - name: Forzar Node.js 24 en actions JS (silencia warning de deprecación)
      shell: bash
      run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

    - name: Instalar unzip (por si falta en el runner)
      shell: bash
      run: |
        if ! command -v unzip >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip
        fi
        unzip -v | head -1

    - name: Verificar Python 3 (usado por scraper APKMirror)
      shell: bash
      run: python3 --version

    - name: Setup JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Android SDK (build-tools para apksigner + zipalign)
      # Antes: android-actions/setup-android@v3 con cmdline-tools-version '12.0'.
      # Desde el 2026-10-25 el runner trae otra version de cmdline-tools y el
      # action intentaba bajar un zip inexistente (404): build muerto en 7 s.
      # Ahora se usa el sdkmanager que ya trae el runner, sin version fija.
      uses: ./.github/actions/android-sdk
      with:
        packages: 'build-tools;34.0.0 platform-tools'

    - name: Añadir build-tools al PATH
      shell: bash
      run: |
        # 34.0.0 si esta; si no, la build-tools mas nueva que tenga apksigner.
        BT_DIR="$ANDROID_SDK_ROOT/build-tools/34.0.0"
        if [ ! -x "$BT_DIR/apksigner" ]; then
          BT_DIR="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          BT_DIR="${BT_DIR%/}"
        fi
        [ -n "$BT_DIR" ] && [ -x "$BT_DIR/apksigner" ] || { echo "::error::No hay build-tools con apksigner en $ANDROID_SDK_ROOT"; exit 1; }
        echo "$BT_DIR" >> "$GITHUB_PATH"
        echo "Añadido: $BT_DIR"

    - name: Verificar toolchain
      shell: bash
      run: |
        echo "== java ==";      java -version 2>&1 | head -1
        echo "== apksigner =="; apksigner --version || true
        echo "== zipalign =="; zipalign 2>&1 | head -1 || true
        echo "== python3 ==";   python3 --version
        echo "== jq ==";        jq --version
        echo "== gh ==";        gh --version | head -1

    - name: fetch-apks
      shell: bash
      env:
        YT_VERSION: ${{ inputs.youtube_version }}
        YTM_VERSION: ${{ inputs.ytmusic_version }}
        APKEEP_SOURCE: ${{ inputs.apkeep_source }}
        GH_TOKEN: ${{ inputs.gh_token }}
        REVANCED_CLI_REPO: ${{ inputs.revanced_cli_repo }}
        REVANCED_CLI_TAG: ${{ inputs.revanced_cli_tag }}
        REVANCED_PATCHES_REPO: ${{ inputs.revanced_patches_repo }}
      run: |
        set -o pipefail
        bash project-a/scripts/fetch-apks.sh 2>&1 | tee /tmp/fetch-apks.log

    - name: apply-patches
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REVANCED_CLI_REPO: ${{ inputs.revanced_cli_repo }}
        REVANCED_CLI_TAG: ${{ inputs.revanced_cli_tag }}
        REVANCED_PATCHES_REPO: ${{ inputs.revanced_patches_repo }}
        REVANCED_GMSCORE_REPO: ${{ inputs.revanced_gmscore_repo }}
        REVANCED_GMSCORE_REGEX: ${{ inputs.revanced_gmscore_regex }}
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        DISPLAY: ":99"
      run: |
        set -o pipefail
        sudo apt-get install -y -qq xvfb 2>/dev/null || true
        Xvfb :99 -screen 0 1024x768x24 &
        sleep 2
        bash project-a/scripts/apply-patches.sh 2>&1 | tee /tmp/apply-patches.log

    - name: sign-apks
      shell: bash
      env:
        ANDROID_KEYSTORE_BASE64:   ${{ inputs.android_keystore_base64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.android_keystore_password }}
        ANDROID_KEY_ALIAS:         ${{ inputs.android_key_alias }}
        ANDROID_KEY_PASSWORD:      ${{ inputs.android_key_password }}
      run: bash project-a/scripts/sign-apks.sh

    - name: create-release
      if: inputs.publish_release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        FORCE_RELEASE: ${{ inputs.force_release == 'true' && '1' || '0' }}
        DEVICE_NAME: 'Samsung Galaxy A04e'
        RELEASE_NOTE_PREFIX: ${{ inputs.release_note_prefix }}
      run: bash project-a/scripts/create-release.sh

    - name: Guardar log en el repo si falla
      if: failure()
      shell: bash
      run: |
        mkdir -p debug
        : > debug/last-error.log
        echo "run_id=${{ github.run_id }}  fecha=$(date -u +%FT%TZ)" >> debug/last-error.log
        for f in /tmp/fetch-apks.log /tmp/apply-patches.log; do
          if [ -f "$f" ]; then
            echo "" >> debug/last-error.log
            echo "===================== $f =====================" >> debug/last-error.log
            tail -150 "$f" >> debug/last-error.log
          fi
        done
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f debug/last-error.log
        git commit -m "debug: log de build fallido (run ${{ github.run_id }})" || exit 0
        git pull --rebase --autostash || true
        git push || echo "push falló (no bloqueante)"

    - name: Subir meta como artifact (siempre)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: project-a-meta-${{ github.run_id }}
        path: project-a/build/meta/
        retention-days: 14
        if-no-files-found: ignore

    - name: Subir APKs firmados como artifact (si hay)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: project-a-signed-${{ github.run_id }}
        path: project-a/build/signed/*.apk
        retention-days: 7
        if-no-files-found: ignore
